# Local RTCM3 rover + RTCM 4047/64 PPP-B2b replay
PPP_Glo.RT_flag = 1

# processing options
prcopt.mode = 7
prcopt.navsys = 41
prcopt.sateph = 5
prcopt.nf = 2
# BDS solution-slot order; the first two entries form the IF combination.
prcopt.bdsfreqs = B1I,B3I
prcopt.elmin = 3
prcopt.snrmask_L1 = 38,38,38,38,38,38,38,38,38
prcopt.snrmask_L2 = 38,38,38,38,38,38,38,38,38
prcopt.snrmask_L5 = 38,38,38,38,38,38,38,38,38
prcopt.snrmask_r = 0
prcopt.snrmask_b = 0
prcopt.exclsats =

# GEC dual-frequency ionosphere-free PPP (GPS + Galileo + BDS).
# BDS uses the first two prcopt.bdsfreqs entries: B1I + B3I.
prcopt.ionoopt = 3
prcopt.tropopt = 3
prcopt.tidecorr = 3
prcopt.dynamics = 0
prcopt.posopt[0] = 1
prcopt.posopt[1] = 0
prcopt.posopt[2] = 1
prcopt.posopt[3] = 1
prcopt.posopt[4] = 1
prcopt.B2b_format = 20
prcopt.outsingle = 0

# Receiver model/radome is unknown: disable receiver antenna PCV correction.
# Keep the type empty and offsets at zero until the exact ANTEX TYPE is known.
prcopt.anttype[0] =
prcopt.antdel[0][0] = 0.00
prcopt.antdel[0][1] = 0.00
prcopt.antdel[0][2] = 0.00

# file options (absolute paths are independent of the launch directory)
filopt.satantp = D:/WORK-FRR/RTKLIB-B2b-master/example/rtppp/conf/igs20_2350.atx
filopt.rcvantp = D:/WORK-FRR/RTKLIB-B2b-master/example/rtppp/conf/igs20_2350.atx
filopt.blq = D:/WORK-FRR/RTKLIB-B2b-master/example/rtppp/conf/ocnload_241227.blq
filopt.tempdir = D:/WORK-FRR/RTKLIB-B2b-master/example/rtppp/conf/Temp
filopt.trace = D:/WORK-FRR/RTKLIB-B2b-master/example/rtppp/output/rtppp_%Y_%m_%d.trace

# solution output options
solopt.posf = 0
solopt.outhead = 1
solopt.outopt = 1
solopt.outvel = 0
solopt.times = 0
solopt.timef = 1
solopt.timeu = 3
solopt.degform = 0
solopt.fieldsep =
solopt.maxsolstd = 0
solopt.height = 0
solopt.geoid = 0
solopt.solstatic = 0
solopt.nmeaintv1 = 0
solopt.nmeaintv2 = 0
solopt.outstat = 1
solopt.trace = 0

# observation weighting, process noise and rejection thresholds
prcopt.eratio1 = 200
prcopt.eratio2 = 200
prcopt.eratio5 = 300
prcopt.errphase = 0
prcopt.errphaseel = 0.003
prcopt.errphasebl = 0
prcopt.errdoppler = 1
prcopt.snrmax = 52
prcopt.errsnr = 0
prcopt.errrcv = 0
prcopt.stdbias = 30
prcopt.stdiono = 0.03
prcopt.stdtrop = 0.3
prcopt.prnaccelh = 10
prcopt.prnaccelv = 10
prcopt.prnbias = 0
prcopt.prniono = 100
prcopt.prntrop = 0.0001
prcopt.prnpos = 0
prcopt.clkstab = 5e-12
prcopt.slipthres = 0.05
prcopt.dopthres = 0
prcopt.rejionno = 100
prcopt.rejcode = 100

# input streams: rover RTCM3, no base, PPP-B2b private RTCM
strtype[0] = 2
strtype[1] = 0
strtype[2] = 2
strfmt[0] = 1
strfmt[1] = 0
strfmt[2] = 20
strpath[0] = D:/WORK-FRR/DATA/ROVER::T=D:/WORK-FRR/RTKLIB-B2b-master/example/rtppp/ROVER.tag::x100
strpath[1] =
strpath[2] = D:/WORK-FRR/DATA/ppp::T=D:/WORK-FRR/RTKLIB-B2b-master/example/rtppp/ppp.tag::x100
navmsgsel = 1
sta_name = ROVER

# output streams: LLH solution file, secondary output disabled
strtype[3] = 2
strtype[4] = 0
strfmt[3] = 0
strfmt[4] = 0
strpath[3] = D:/WORK-FRR/RTKLIB-B2b-master/example/rtppp/output/rtppp_local.pos
strpath[4] =

# raw stream logs disabled
strtype[5] = 0
strtype[6] = 0
strtype[7] = 0
strpath[5] =
strpath[6] =
strpath[7] =

# server options
svrcycle = 10
timeout = 10000
reconnect = 10000
nmeacycle = 5000
buffsize = 32768
